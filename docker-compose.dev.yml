services:
  cloud-sql-proxy:
    image: gcr.io/cloudsql-docker/gce-proxy
    command: >
      /cloud_sql_proxy
      -instances=newsletter-412722:us-central1:openwebui-db=tcp:5432
      -credential_file=/secrets/cloudsql/credentials.json
    volumes:
      # Mount credentials.json from root folder to /secrets/cloudsql/ inside container
      - ./credentials.json:/secrets/cloudsql/credentials.json:ro
    networks:
      - litellm_network

  open-webui:
    build:
      context: ./open-webui
      dockerfile: Dockerfile.crun
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgresql://postgres:M1xcoff33!@cloud-sql-proxy:5432/openwebui
      - WEBUI_SECRET_KEY=your_secret_key_here
      - WEBUI_AUTH=true
      - ENABLE_SIGNUP=false
      - WEBUI_URL=http://localhost:8080
      - LITELLM_API_URL=http://localhost:4000
      - LITELLM_MASTER_KEY=sk-1234
      - PLAN_TEST=pro
      - STRIPE_PRICE_ID=price_1RnVuMRoIzbn9VW9UJ5PimsV
      - STRIPE_SECRET_KEY=sk_test_51RnVkeRoIzbn9VW93cGgiTl3K3XuncMdCP2D3WkEEKc2qLGiAe4V2gBHKRSAOdTKgzBBZY3CTqFOwNDHqzUgmP7900Yv2TTFvH
      - STRIPE_WEBHOOK_SECRET=whsec_e33ed9d908019d2b044b89c8fe14725e2a26c29fb9785b8138802333e3f840bc
    networks:
      - litellm_network
    volumes:
      - ./open-webui:/app
    command: >
      bash -c "
        cd /app/backend &&
        uvicorn open_webui.main:app --host 0.0.0.0 --port 8080 --reload --log-level debug
      "
    restart: unless-stopped
    depends_on:
      - cloud-sql-proxy

networks:
  litellm_network:
    name: litellm_network
    external: true